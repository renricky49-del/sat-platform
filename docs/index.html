      ${weekCardHTML(weekReport(ws))}
    </section>
    <section class="card"><div class="sec-head"><h2>本周每日答题情况</h2><span class="muted">美西时间</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>日期</th><th>新题</th><th>阅读 正确率 · 用时</th><th>数学 正确率 · 用时</th><th>错题巩固</th><th>金币</th></tr></thead><tbody>${rows}</tbody></table></div>
    </section>
    ${redeemHTML(false)}
    ${past.length ? `<section class="card"><div class="sec-head"><h2>往期周报</h2></div>${past.map((w) => weekCardHTML(weekReport(w), { pet: false })).join('')}</section>` : ''}`, 'parent');
  bindRefresh();
  bindRedeem(VIEWS.parent);
};

/* ============ 老师视图 ============ */
VIEWS.teacher = () => {
  const st = typeStats();
  const order = Object.keys(TYPE_NAME);
  const rows = Object.values(st).sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type)).map((x) => {
    const last = x.sessions.slice(-3).map((s) => `<span class="spark-v" title="${md(s.d)}">${Math.round(s.acc * 100)}</span>`).join('');
    return `<tr><td><span class="badge ${typeSec(x.type)}">${SEC_NAME[typeSec(x.type)]}</span> ${esc(typeName(x.type))}</td>
      <td>${x.q || '—'}</td><td>${x.q ? pct(x.c, x.q) + '%' : '—'}</td><td>${x.q ? fmtSec(x.ms / x.q) : '—'}</td>
      <td class="spark-cell">${last || '—'}</td>
      <td>${x.xq ? `${pct(x.xc, x.xq)}%（${x.xq}）` : '—'}</td>
      <td>${x.rq ? `${pct(x.rc, x.rq)}%（${x.rq}）` : '—'}</td>
      <td>${(x.wOpen || 0)} / ${(x.wDone || 0)}</td></tr>`;
  }).join('') || '<tr><td colspan="8" class="empty">还没有做题数据。</td></tr>';
  const render = () => {
    mount(`${ROLE === 'student' ? '<div class="notice">这是老师看到的页面（预览）。</div>' : ''}
      <section class="card"><div class="sec-head"><h1>老师视图</h1><button class="btn small ghost" id="refresh">刷新数据</button></div>
        <p class="muted">每日新题按题型统计；“最近 3 次”是最近三次该题型关卡的正确率（%）。难度均为 Hard（题库不足时会用 Medium 补充，题目页有标注）。</p>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>题型</th><th>新题数</th><th>正确率</th><th>平均每题</th><th>最近 3 次</th><th>额外练习</th><th>错题巩固</th><th>错题 待复习/已掌握</th></tr></thead><tbody>${rows}</tbody></table></div>
      </section>
      <section class="card"><div class="sec-head"><h2>错题详情</h2><span class="muted">点「查看题目与解析」看原题、学生答案和笔记</span></div>
        ${wbFilters()}<ul class="wb-list">${wrongList(true)}</ul></section>`, 'teacher');
    bindRefresh();
    bindWrongList(true, render);
  };
  render();
};
function bindRefresh() {
  const b = $('#refresh');
  if (b) b.onclick = async () => { b.disabled = true; await Store.loadAll(COLLECTIONS); go(VIEW.name, VIEW.params); toast('已刷新'); };
}

/* ============ 设置 ============ */
VIEWS.settings = () => {
  const s = settings();
  const items = allUnlocks();
  mount(`<section class="card settings">
    <div class="sec-head"><h1>设置</h1></div>
    <form id="setForm" class="set-form">
      <label>答题页显示的名字<input id="setName" value="${esc(s.name || '')}" placeholder="例如 Ricky"></label>
      <label>每天错题巩固上限（每部分，0 = 全部做完）<input id="setCap" type="number" min="0" value="${+s.reviewCap || 0}"></label>
      <h3>解锁门槛（累计金币）</h3>
      <div class="set-unlocks">${items.map((u) => `<label><span>${KIND_CN[u.kind]} · ${esc(u.name)}</span><input type="number" min="0" data-id="${u.id}" value="${u.at}"></label>`).join('')}</div>
      <button class="btn primary" type="submit">保存设置</button>
    </form>
    <div class="notice">数据保存位置：${Store.mode === 'cloud' ? 'Supabase 云端（任何设备登录都能接着做；家长和老师看到的是同一份数据）' : '这个浏览器本机（调试模式）'}。</div>
  </section>`, 'settings');
  $('#setForm').onsubmit = (e) => {
    e.preventDefault();
    const n = clone(settings());
    n.name = $('#setName').value.trim();
    n.reviewCap = Math.max(0, Math.floor(+$('#setCap').value || 0));
    n.unlocks = {};
    $$('.set-unlocks input').forEach((i) => (n.unlocks[i.dataset.id] = Math.max(0, Math.floor(+i.value || 0))));
    saveSettings(n);
    toast('设置已保存');
    VIEWS.settings();
  };
};

/* ============ 启动 ============ */
const COLLECTIONS = ['runs', 'reviews', 'wrong', 'notes', 'extras', 'days', 'weekly', 'meta'];

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-go]');
  if (b && !b.disabled) { e.preventDefault(); go(b.dataset.go); }
});
window.addEventListener('pagehide', () => { if (PR) { trackTime(); PR.sess.save(true); } Store.flush(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (PR) { trackTime(); PR.sess.save(true); } Store.flush(); }
  else if (ROLE === 'student' && !PR && checkTimers()) go(VIEW.name, VIEW.params);
});
// 过了午夜（美西时间）自动刷新首页
let LAST_DAY = null;
setInterval(() => {
  if (ROLE !== 'student') return;
  if (PR) return;
  const changed = checkTimers();
  const T = todayStr();
  if ((changed || (LAST_DAY && T !== LAST_DAY)) && VIEW.name === 'home' && !$('.modal-back')) go('home');
  LAST_DAY = T;
}, 15000);

async function boot() {
  $('#app').innerHTML = '<div class="boot"><div class="boot-cat"></div><p>正在铺好今天的关卡…</p></div>';
  let st;
  try { st = await Store.init(); } catch (e) { bootError(e); return; }
  if (st === 'login') return showLogin();
  if (st === 'norole') return showNoRole();
  startApp();
}
function bootError(e) {
  $('#app').innerHTML = `<div class="boot"><p>没能加载：${esc(e.message || e)}。刷新页面再试一次。</p></div>`;
}
function showLogin(msg) {
  $('#app').innerHTML = `<div class="login-wrap"><form class="card login" id="loginForm">
    <div class="login-cat">${petHTML({ cat: 'orange', h: 110, mode: 'idle' })}</div>
    <h1>喵喵 SAT 通关</h1>
    <p class="muted">学生、家长、老师都从这里登录，系统会自动打开对应的页面。</p>
    <label for="lgEmail">邮箱</label><input id="lgEmail" type="email" autocomplete="username" required>
    <label for="lgPass">密码</label><input id="lgPass" type="password" autocomplete="current-password" required>
    ${msg ? `<p class="login-err">${esc(msg)}</p>` : ''}
    <button class="btn primary big" type="submit" id="lgBtn">登录</button>
    <p class="muted small-note">账号由家里统一创建，忘记密码请找管理账号的人在 Supabase 后台重置。</p>
  </form></div>`;
  $('#loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const b = $('#lgBtn');
    b.disabled = true; b.textContent = '登录中…';
    try {
      const st = await Store.login($('#lgEmail').value.trim(), $('#lgPass').value);
      if (st === 'norole') return showNoRole();
      // 刚登录时立刻读数据有时还没带上登录凭证，刷新一次最稳
      location.reload();
    } catch (err) {
      showLogin(/invalid/i.test(err.message || '') ? '邮箱或密码不对，再试一次。' : '登录失败：' + (err.message || err));
    }
  };
}
function showNoRole() {
  $('#app').innerHTML = `<div class="boot"><div><p>这个账号（${esc(Store.email)}）还没有分配身份（学生 / 家长 / 老师）。</p>
    <p class="muted">请管理账号的人在 Supabase 的 profiles 表里加上这个账号。</p><button class="btn" id="lgOut">换个账号登录</button></div></div>`;
  $('#lgOut').onclick = () => Store.logout();
}
async function startApp() {
  $('#app').innerHTML = '<div class="boot"><div class="boot-cat"></div><p>正在铺好今天的关卡…</p></div>';
  try {
    await loadQuestions();
    await Store.loadAll(COLLECTIONS);
  } catch (e) { bootError(e); return; }
  ROLE = Store.role === 'student' ? 'student' : Store.role;
  const hash = (location.hash || '').replace('#', '');
  LAST_DAY = todayStr();
  if (ROLE === 'student') {
    checkTimers();
    const resume = findActiveSession();
    if (resume) { VIEW = { name: 'practice', params: {} }; startSession(resume); toast('已回到上次的作答，倒计时一直在走'); return; }
    if (hash === 'parent' || hash === 'teacher') { go(hash); return; }
    go('home');
  } else go(ROLE);
}
function findActiveSession() {
  for (const r of Store.all('runs')) for (const sec of ['rw', 'math']) {
    const S = r.sections[sec];
    const idx = S.stages.findIndex((x) => x.status === 'active');
    if (idx >= 0 && S.runningSince) return { kind: 'run', id: r.dayId, sec, idx };
  }
  for (const rv of Store.all('reviews')) for (const sec of ['rw', 'math']) if (rv.sections[sec].status === 'active' && rv.sections[sec].runningSince) return { kind: 'review', id: rv.date, sec };
  const e = Store.all('extras').find((x) => x.status === 'active' && x.runningSince);
  return e ? { kind: 'extra', id: e.id } : null;
}
boot();

</script>
</body>
</html>
