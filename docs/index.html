<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>喵喵SAT通关</title>
<meta name="description" content="SAT 每日关卡练习：Bluebook 风格答题、错题本、金币与像素猫">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Jersey+10&family=ZCOOL+KuaiLe&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* 版式：像素游戏外壳（粗描边 + 硬投影卡片）包住一张 Bluebook 白纸答题区 */
:root {
  --bg: #dcefe8;
  --bg-dot: #cbe5db;
  --card: #fffdf6;
  --card-2: #f6efe0;
  --ink: #3b2a20;
  --ink-2: #6b5646;
  --muted: #8a7867;
  --line: #3b2a20;
  --teal: #1d9a8d;
  --teal-2: #157166;
  --teal-soft: #d3eee8;
  --gold: #f2b134;
  --gold-2: #b47809;
  --gold-soft: #fcefc9;
  --pink: #f2809f;
  --pink-soft: #fde2e9;
  --sky: #4d9fe0;
  --good: #2c9a50;
  --good-soft: #daf2e1;
  --bad: #d4463a;
  --bad-soft: #fadfdb;
  --chip: #efe5d1;
  --shadow: rgba(59, 42, 32, .18);
  /* 答题纸：两种主题都保持白底，官方图表才能看清 */
  --paper: #ffffff;
  --paper-ink: #1e1e1e;
  --paper-line: #cfcfcf;
  --paper-soft: #f2f2f2;
  --bb-blue: #324dc7;
  --bb-blue-2: #263c9e;
  --f-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-px: "Jersey 10", "Noto Sans SC", ui-monospace, monospace;
  --f-fun: "ZCOOL KuaiLe", "Noto Sans SC", "PingFang SC", sans-serif;
  --f-q: "Noto Serif", Georgia, "Times New Roman", serif;
  --f-bb: "Noto Sans", "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b2030; --bg-dot: #222a3d; --card: #272f46; --card-2: #2f3853; --ink: #f3e9d8; --ink-2: #d2c4b2; --muted: #a59a8d; --line: #0b0e17;
    --teal: #33b8a9; --teal-2: #24897e; --teal-soft: #1d3d42; --gold: #f4bd4c; --gold-2: #d99a1f; --gold-soft: #463a1c; --pink: #f597b0; --pink-soft: #4a2934;
    --sky: #6db3ea; --good: #4bbf70; --good-soft: #1d3c2a; --bad: #ee6a5e; --bad-soft: #4a2420; --chip: #333c58; --shadow: rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b2030; --bg-dot: #222a3d; --card: #272f46; --card-2: #2f3853; --ink: #f3e9d8; --ink-2: #d2c4b2; --muted: #a59a8d; --line: #0b0e17;
  --teal: #33b8a9; --teal-2: #24897e; --teal-soft: #1d3d42; --gold: #f4bd4c; --gold-2: #d99a1f; --gold-soft: #463a1c; --pink: #f597b0; --pink-soft: #4a2934;
  --sky: #6db3ea; --good: #4bbf70; --good-soft: #1d3c2a; --bad: #ee6a5e; --bad-soft: #4a2420; --chip: #333c58; --shadow: rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.5px, transparent 1.6px);
  background-size: 18px 18px;
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.55;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: 24px; font-weight: 900; }
h2 { font-size: 18px; font-weight: 800; }
h3 { font-size: 16px; font-weight: 700; }
.muted { color: var(--muted); }
.lnk { background: none; border: 0; padding: 0; color: var(--teal-2); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.lnk.danger { color: var(--bad); }
.coin-txt { color: var(--gold-2); }

/* ---------- 外壳 ---------- */
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 3px solid var(--line); }
.topbar-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; font-family: var(--f-fun); font-size: 20px; white-space: nowrap; }
.brand img { height: 34px; image-rendering: auto; }
.tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.tab { background: none; border: 2px solid transparent; border-radius: 8px; padding: 6px 12px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.tab:hover { background: var(--chip); }
.tab.on { background: var(--teal-soft); border-color: var(--line); color: var(--ink); }
.top-right { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 3px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 6px; font-family: var(--f-px); font-weight: 400; font-size: 21px; line-height: 1.1; background: var(--gold-soft); box-shadow: 0 3px 0 var(--line); }
.lv-pill { background: var(--pink-soft); padding-left: 10px; }
.coin { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: var(--gold); box-shadow: inset 0 0 0 2px var(--gold-2), inset 3px 3px 0 2px #ffe08a; vertical-align: -3px; flex: none; }
.coin.sm { width: 13px; height: 13px; box-shadow: inset 0 0 0 2px var(--gold-2); vertical-align: -1px; }
.page { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding-block: 22px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; align-items: center; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); font-size: 13px; color: var(--muted); }
.foot-links { display: flex; gap: 14px; }
.save-state.err { color: var(--bad); font-weight: 700; }

.card { background: var(--card); border: 3px solid var(--line); border-radius: 12px; box-shadow: 0 5px 0 var(--line); padding: 20px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.notice { background: var(--gold-soft); border: 2px dashed var(--gold-2); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.empty { color: var(--muted); padding: 10px 0; list-style: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 3px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font-weight: 800; padding: 8px 16px; box-shadow: 0 4px 0 var(--line); transition: transform .06s, box-shadow .06s; text-decoration: none; }
.btn:hover:not(:disabled) { filter: brightness(1.04); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--teal); color: #fff; }
.btn.ghost { background: var(--card-2); }
.btn.big { font-size: 19px; padding: 13px 26px; border-radius: 14px; }
.btn.small { font-size: 13px; padding: 4px 12px; border-width: 2px; box-shadow: 0 3px 0 var(--line); border-radius: 9px; }
.btn:disabled { opacity: .45; }
.cta-arrow { font-size: 14px; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: 13px; }
.chip.on { background: var(--ink); color: var(--card); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { display: inline-block; font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: 6px; border: 2px solid var(--line); white-space: nowrap; }
.badge.rw { background: var(--pink-soft); }
.badge.math { background: var(--teal-soft); }
.ok-tag, .bad-tag { font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: 6px; background: var(--good-soft); color: var(--good); }
.bad-tag { background: var(--bad-soft); color: var(--bad); }
.kicker { font-size: 13px; font-weight: 800; letter-spacing: .04em; color: var(--teal-2); }

.pxbar { height: 20px; border: 3px solid var(--line); border-radius: 6px; background: var(--chip); overflow: hidden; }
.pxbar i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--teal) 0 10px, var(--teal-2) 10px 12px); border-right: 3px solid var(--line); min-width: 4px; }
.pxbar.thin { height: 12px; border-width: 2px; }
.pxbar.thin i { background: var(--gold); border-right-width: 2px; }

/* ---------- 首页 ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; }
.quest { display: flex; flex-direction: column; gap: 16px; background: var(--card); position: relative; overflow: hidden; }
.quest.cleared { background: linear-gradient(var(--good-soft), var(--card) 60%); }
.quest-head { display: flex; justify-content: space-between; gap: 16px; }
.quest h1 { font-family: var(--f-fun); font-weight: 400; font-size: 34px; letter-spacing: .02em; }
.quest-date { flex: none; text-align: center; border: 3px solid var(--line); border-radius: 10px; overflow: hidden; width: 74px; box-shadow: 0 3px 0 var(--line); }
.quest-date span { display: block; background: var(--bad); color: #fff; font-size: 12px; font-weight: 800; padding: 2px 0; }
.quest-date b { display: block; font-size: 20px; padding: 4px 0; font-family: var(--f-fun); font-weight: 400; }
.stage-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.stage-chip { display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 10px; padding: 5px 10px 5px 6px; background: var(--card-2); font-size: 14px; }
.stage-chip.done { background: var(--good-soft); }
.stage-chip.done .sc-n::before { content: "✓ "; color: var(--good); font-weight: 900; }
.stage-chip.now { background: var(--gold-soft); box-shadow: 0 0 0 3px var(--gold); }
.sc-sec { font-size: 11px; font-weight: 900; padding: 1px 6px; border-radius: 5px; color: #fff; background: var(--pink); }
.sc-sec.math { background: var(--teal); }
.sc-sec.rv { background: var(--gold-2); }
.sc-name { font-weight: 700; }
.sc-n { font-family: var(--f-px); font-size: 18px; line-height: 1; color: var(--ink-2); }
.quest-cta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: auto; }
.countdown { display: flex; flex-direction: column; gap: 10px; background: var(--gold-soft); }
.cd-label { font-weight: 700; color: var(--ink-2); }
.cd-num { display: flex; align-items: baseline; gap: 6px; }
.cd-num .big { font-family: var(--f-px); font-weight: 400; font-size: 104px; line-height: .9; color: var(--ink); text-shadow: 3px 3px 0 var(--gold); }
.cd-num .unit { font-family: var(--f-fun); font-size: 24px; }
.cd-foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.cd-week { font-size: 13px; color: var(--muted); }

.weekmap { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; position: relative; }
.weekmap::before { content: ""; position: absolute; left: 7%; right: 7%; top: 21px; border-top: 4px dotted var(--muted); z-index: 0; }
.wm-node { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.wm-dot { width: 44px; height: 44px; border-radius: 12px; border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--f-px); font-size: 24px; background: var(--card-2); box-shadow: 0 3px 0 var(--line); }
.wm-node.clear .wm-dot { background: var(--gold); color: var(--ink); font-size: 24px; }
.wm-node.today .wm-dot { background: var(--teal); color: #fff; animation: bob 1.4s ease-in-out infinite; }
.wm-node.miss .wm-dot { background: var(--bad-soft); color: var(--bad); }
.wm-node.future .wm-dot, .wm-node.rest .wm-dot { opacity: .65; }
.wm-day { font-weight: 800; font-size: 13px; margin-top: 4px; }
.wm-date { font-size: 12px; color: var(--muted); }
.wm-tag { font-size: 11px; font-weight: 800; padding: 0 6px; border-radius: 5px; background: var(--chip); }
.wm-coin { font-family: var(--f-px); font-size: 17px; display: flex; align-items: center; gap: 3px; color: var(--gold-2); }
@keyframes bob { 50% { transform: translateY(-4px); } }

.makeup .mk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mk-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; border: 2px dashed var(--line); border-radius: 10px; flex-wrap: wrap; }

/* ---------- 小窝 ---------- */
.room { position: relative; width: 100%; aspect-ratio: 1032 / 576; border: 3px solid var(--line); border-radius: 10px; overflow: hidden; background: #f3dfa6; }
.room-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
.deco { position: absolute; height: auto; image-rendering: auto; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .12)); }
.room-pet { position: absolute; left: 50%; bottom: 3.5%; height: 42%; transform: translateX(-50%); }
.room-pet.on-bed { bottom: 6.5%; }
.room-card .room { max-width: 860px; margin: 0 auto; }
.unlock-line { max-width: 860px; margin-inline: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 12px; font-size: 14px; }
.unlock-line .pxbar { max-width: 360px; }

/* ---------- 像素萌宠 ---------- */
.pet { position: relative; height: var(--ph); width: calc(var(--ph) * var(--pr)); cursor: pointer; user-select: none; -webkit-user-select: none; }
.pet.fluid { height: 100%; width: auto; aspect-ratio: var(--pr); }
.pet-inner { position: absolute; inset: 0; transform-origin: 50% 100%; }
.pose { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.pose.blink, .pose.cheer { opacity: 0; }
.wear { position: absolute; height: auto; pointer-events: none; }
.pet-shadow { position: absolute; left: 18%; right: 18%; bottom: -3%; height: 7%; border-radius: 50%; background: var(--shadow); z-index: -1; }
.pet.idle .pet-inner { animation: breathe 2.6s ease-in-out infinite; }
.pet.idle .pose.blink { animation: blink 5s steps(1) infinite; }
.pet.hop .pet-inner { animation: hop .8s cubic-bezier(.3, .7, .4, 1); }
.pet.hop .pose.blink { opacity: 1; }
.pet.party .pet-inner { animation: party 1.25s ease-in-out infinite; }
.pet.party .pose.base { opacity: 0; }
.pet.party .pose.cheer { opacity: 1; }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.012, .975); } }
@keyframes blink { 0%, 91% { opacity: 0; } 92%, 95% { opacity: 1; } 96%, 100% { opacity: 0; } }
@keyframes hop { 0% { transform: scale(1.06, .9); } 30% { transform: translateY(-26%) scale(.96, 1.06); } 58% { transform: translateY(0) scale(1.08, .9); } 78% { transform: translateY(-5%) scale(1, 1.02); } 100% { transform: none; } }
@keyframes party { 0% { transform: scale(1.06, .92); } 25% { transform: translateY(-18%) rotate(-5deg); } 50% { transform: translateY(0) scale(1.06, .92); } 75% { transform: translateY(-18%) rotate(5deg); } 100% { transform: scale(1.06, .92); } }
.spark { display: none; position: absolute; width: 10px; height: 10px; background: var(--gold); box-shadow: 0 0 0 2px var(--line); transform: rotate(45deg); opacity: 0; animation: spark 1.25s ease-out infinite; }
.spark.s1 { left: 0; top: 20%; } .spark.s2 { right: 0; top: 10%; animation-delay: .25s; background: var(--pink); }
.spark.s3 { left: 15%; top: -6%; animation-delay: .5s; background: var(--sky); } .spark.s4 { right: 12%; top: 40%; animation-delay: .7s; }
.spark.s5 { left: 48%; top: -14%; animation-delay: .95s; background: var(--teal); }
.pet.party .spark { display: block; }
@keyframes spark { 0% { opacity: 0; transform: translateY(10px) rotate(45deg) scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px) rotate(45deg) scale(1.1); } }

/* ---------- 关卡开始 / 结果 ---------- */
.intro { display: flex; gap: 36px; align-items: center; padding: 34px; }
.intro-pet { flex: none; display: grid; place-items: center; width: 220px; height: 200px; background: var(--teal-soft); border: 3px solid var(--line); border-radius: 50% 50% 14px 14px; padding-top: 26px; }
.intro-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.intro-title { font-family: var(--f-fun); font-weight: 400; font-size: 40px; }
.intro-stats { display: flex; gap: 12px; flex-wrap: wrap; }
.intro-stats div { border: 3px solid var(--line); border-radius: 10px; padding: 6px 14px; background: var(--card-2); display: flex; flex-direction: column; min-width: 92px; }
.intro-stats b { font-family: var(--f-px); font-size: 32px; font-weight: 400; line-height: 1.1; }
.intro-stats span { font-size: 12px; color: var(--muted); }
.intro-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.result-top { display: flex; gap: 28px; align-items: center; margin-bottom: 22px; }
.result-pet { flex: none; width: 200px; height: 190px; display: grid; place-items: end center; background: radial-gradient(circle at 50% 70%, var(--gold-soft) 0 60%, transparent 61%); padding-bottom: 12px; }
.result-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1; }
.result-title { font-family: var(--f-fun); font-weight: 400; font-size: 38px; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
.result-title span { font-family: var(--f-ui); font-size: 18px; font-weight: 800; color: var(--ink-2); }
.result-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rs { border: 3px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--card-2); display: flex; flex-direction: column; }
.rs span { font-size: 13px; color: var(--ink-2); font-weight: 700; }
.rs b { font-family: var(--f-px); font-size: 42px; font-weight: 400; line-height: 1.05; }
.rs small { color: var(--muted); font-size: 12px; }
.sec-done { background: var(--good-soft); border-radius: 8px; padding: 6px 12px; margin: 0; font-weight: 600; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 10px; }
.qg { position: relative; height: 56px; border: 3px solid var(--line); border-radius: 10px; font-family: var(--f-px); font-size: 26px; font-weight: 400; box-shadow: 0 3px 0 var(--line); display: flex; align-items: center; justify-content: center; gap: 4px; }
.qg.ok { background: var(--good-soft); }
.qg.bad { background: var(--bad-soft); }
.qg i { font-style: normal; font-size: 14px; }
.qg.ok i { color: var(--good); } .qg.bad i { color: var(--bad); }
.qg:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.result-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }

/* ---------- 弹窗 ---------- */
.modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(28, 20, 12, .5); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { position: relative; width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; background: var(--card); border: 3px solid var(--line); border-radius: 16px; box-shadow: 0 6px 0 var(--line); padding: 26px; }
.modal.small { max-width: 420px; }
.modal.wide { max-width: 820px; }
.modal-x { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 26px; line-height: 1; color: var(--muted); }
.m-title { margin-bottom: 8px; }
.m-text { color: var(--ink-2); }
.m-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.settle { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.settle-pet { padding-top: 24px; }
.settle-title { font-family: var(--f-fun); font-weight: 400; font-size: 34px; }
.settle-rows { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; }

<script>
/* Supabase 项目（公开密钥本来就写在网页里，安全靠数据库里的权限规则） */
const SUPABASE_URL = 'https://xbvqmeczclyungmyyjae.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0V0a2mFV57Fcw2fgIKaFtA_hk5QVEu0';

'use strict';
/* ============ 基础配置 ============ */
const TZ = 'America/Los_Angeles';
const START = '2026-10-15';
const EXAM = '2026-12-05';
const DAY_MS = 86400000;
const SEC_LIMIT = { rw: 60 * 60000, math: 45 * 60000 };
const REVIEW_PER_Q = { rw: 90000, math: 120000 };
// 额外练习每题时长（按 hard 难度的实际用时估算）
const EXTRA_PER_Q = {
  chart: 90000, evidence: 85000, detail: 80000, inference: 90000, wic: 60000, structure: 75000,
  crosstext: 95000, synthesis: 60000, transition: 50000, boundary: 50000, form: 50000,
  psda: 100000, geo: 120000, alg: 95000, adv: 120000,
};
const SRS = [1, 3, 7, 14, 30]; // 错题复习间隔（天）
const REWARD = { speed: 5, acc: 5, done: 5, review: 5 };
const SEC_NAME = { rw: '阅读', math: '数学' };
const SEC_FULL = { rw: 'Reading and Writing', math: 'Math' };
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

/* ============ 工具函数 ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const sum = (arr, f = (x) => x) => arr.reduce((s, x) => s + (f(x) || 0), 0);

let DEBUG_TODAY = null;
try { DEBUG_TODAY = localStorage.getItem('sat:debugToday'); } catch (e) { /* storage blocked */ }

function laDate(d) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
}
function todayStr() { return DEBUG_TODAY || laDate(new Date()); }
function parseD(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function addDays(s, n) { return new Date(parseD(s) + n * DAY_MS).toISOString().slice(0, 10); }
function diffDays(a, b) { return Math.round((parseD(b) - parseD(a)) / DAY_MS); }
function dow(s) { return new Date(parseD(s)).getUTCDay(); }
function weekStart(s) { return addDays(s, -((dow(s) + 6) % 7)); }
function md(s) { const p = s.split('-'); return `${+p[1]}月${+p[2]}日`; }
function mdw(s) { return `${md(s)} ${WD[dow(s)]}`; }
function fmtClock(ms) {
  ms = Math.max(0, ms);
  const t = Math.ceil(ms / 1000), m = Math.floor(t / 60), s = t % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function fmtDur(ms) {
  if (ms == null || isNaN(ms)) return '—';
  const t = Math.round(ms / 1000), m = Math.floor(t / 60), s = t % 60;
  return m ? `${m}分${String(s).padStart(2, '0')}秒` : `${s}秒`;
}
function fmtSec(ms) { return ms == null || isNaN(ms) ? '—' : `${Math.round(ms / 1000)}秒`; }
function stripHtml(h) {
  const d = document.createElement('div');
  d.innerHTML = h || '';
  d.querySelectorAll('svg,table,figure').forEach((x) => x.remove());
  return d.textContent.replace(/\s+/g, ' ').trim();
}

/* ============ 存储：Supabase（云端）；本地调试时 ?local 用 localStorage ============ */
let SB = null;
const Store = {
  mode: 'local', role: null, isOwner: true, canWrite: true, email: '',
  cache: {},          // collection -> {id: data}
  inflight: {}, queued: {},
  // 返回 'ok' | 'login'（需要登录）| 'norole'（账号还没分配身份）
  async init() {
    if (location.search.includes('local')) { this.mode = 'local'; this.role = 'student'; return 'ok'; }
    if (!window.supabase) throw new Error('数据库组件没有加载出来，请检查网络');
    SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    this.mode = 'cloud';
    const { data } = await SB.auth.getSession();
    if (!data.session) return 'login';
    return this.afterLogin(data.session);
  },
  async afterLogin(session) {
    this.email = session.user.email || '';
    const { data, error } = await SB.from('profiles').select('role').eq('user_id', session.user.id).maybeSingle();
    if (error || !data) { this.role = null; this.canWrite = false; this.isOwner = false; return 'norole'; }
    this.role = data.role;
    this.isOwner = this.role === 'student';
    this.canWrite = this.role === 'student';
    return 'ok';
  },
  async login(email, password) {
    const { data, error } = await SB.auth.signInWithPassword({ email, password });
    if (error) throw error;
    return this.afterLogin(data.session);
  },
  async logout() { if (SB) await SB.auth.signOut(); location.reload(); },
  // 爸爸只能改兑换记录
  canWriteDoc(col, id) { return this.canWrite || (this.role === 'parent' && col === 'meta' && id === 'ledger'); },
  async loadAll(names) {
    for (const n of names) this.cache[n] = {};
    if (this.mode === 'cloud') {
      for (let from = 0; ; from += 1000) {
        const { data, error } = await SB.from('docs').select('col,id,data').range(from, from + 999);
        if (error) { console.warn('load docs', error); break; }
        for (const d of data) if (this.cache[d.col]) this.cache[d.col][d.id] = d.data;
        if (data.length < 1000) break;
      }
    } else if (this.mode === 'local') {
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k.startsWith('satdb:')) continue;
          const [, col, id] = k.split(':');
          if (this.cache[col]) this.cache[col][id] = JSON.parse(localStorage.getItem(k));
        }
      } catch (e) { console.warn('local load', e); }
    }
  },
  get(col, id) { return (this.cache[col] || {})[id]; },
  all(col) { return Object.values(this.cache[col] || {}); },
  put(col, id, data) {
    if (!this.cache[col]) this.cache[col] = {};
    this.cache[col][id] = data;
    if (!this.canWriteDoc(col, id)) return;
    this._write(col, id);
  },
  del(col, id) {
    if (this.cache[col]) delete this.cache[col][id];
    if (!this.canWriteDoc(col, id)) return;
    this._write(col, id, true);
  },
  async _send(col, id, isDelete) {
    const data = this.cache[col] && this.cache[col][id];
    if (this.mode === 'cloud') {
      let res;
      if (isDelete || data === undefined) res = await SB.from('docs').delete().eq('col', col).eq('id', id);
      else if (this.role === 'parent') res = await SB.from('docs').update({ data: clone(data), updated_at: new Date().toISOString() }).eq('col', col).eq('id', id);
      else res = await SB.from('docs').upsert({ col, id, data: clone(data), updated_at: new Date().toISOString() });
      if (res.error) throw res.error;
    } else if (this.mode === 'local') {
      if (isDelete || data === undefined) localStorage.removeItem('satdb:' + col + ':' + id);
      else localStorage.setItem('satdb:' + col + ':' + id, JSON.stringify(data));
    }
  },
  // 同一文档一次只写一个请求，期间的修改合并成下一次写入
  _write(col, id, isDelete) {
    const key = col + '/' + id;
    if (this.inflight[key]) { this.queued[key] = isDelete ? 'del' : 'set'; return; }
    this.inflight[key] = true;
    const run = async () => {
      try {
        try { await this._send(col, id, isDelete); }
        catch (e) { await new Promise((r) => setTimeout(r, 800 + Math.random() * 800)); await this._send(col, id, isDelete); }
        setSaveState('ok');
      } catch (e) {
        console.warn('write failed', key, e);
        setSaveState('err');
      } finally {
        this.inflight[key] = false;
        const q = this.queued[key];
        if (q) { delete this.queued[key]; this._write(col, id, q === 'del'); }
      }
    };
    run();
  },
  // 高频修改（作答、计时）先合并，停顿后再写
  timers: {},
  putSoon(col, id, data, ms = 1500) {
    if (!this.cache[col]) this.cache[col] = {};
    this.cache[col][id] = data;
    const key = col + '/' + id;
    clearTimeout(this.timers[key]);
    this.timers[key] = setTimeout(() => this.put(col, id, this.cache[col][id]), ms);
  },
  flush() {
    for (const key of Object.keys(this.timers)) {
      clearTimeout(this.timers[key]);
      const [col, id] = key.split('/');
      if (this.cache[col] && this.cache[col][id]) this.put(col, id, this.cache[col][id]);
    }
    this.timers = {};
  },
};

function setSaveState(s, code) {
  const el = $('#saveState');
  if (!el) return;
  if (s === 'err') { el.textContent = '保存失败，请检查网络后刷新'; el.className = 'save-state err'; }
  else { el.textContent = Store.mode === 'cloud' ? '已云端保存' : '已保存在本机'; el.className = 'save-state'; }
}

function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 2600);
  setTimeout(() => t.remove(), 3100);
}

/* ============ 题库与周计划 ============ */
let TYPES = {}, WEEKS = [], PLAN = [], QB = {};
const TYPE_NAME = {
  chart: '图表题', evidence: '文本证据题', detail: '细节题', inference: '推断题', wic: '词汇题',
  structure: '结构目的题', crosstext: '双篇题', synthesis: '笔记整合题', transition: '过渡词题',
  boundary: '标点边界题', form: '语法形式题',
  psda: 'Problem-Solving & Data Analysis', geo: 'Geometry & Trigonometry', alg: 'Algebra', adv: 'Advanced Math',
};
const TYPE_SHORT = { psda: 'PSDA', geo: 'Geo & Trig', alg: 'Algebra', adv: 'Adv Math' };
const typeName = (t) => TYPE_NAME[t] || (TYPES[t] && TYPES[t].name) || t;
const typeShort = (t) => TYPE_SHORT[t] || typeName(t);
const typeSec = (t) => (TYPES[t] && TYPES[t].sec) || (['psda', 'geo', 'alg', 'adv'].includes(t) ? 'math' : 'rw');

// 题目只存在 Supabase（登录后才能读）；?local 调试时读本地 data/ 文件
async function loadQuestions() {
  if (Store.mode === 'cloud') {
    const w = await SB.from('weeks').select('week,data').order('week');
    if (w.error) throw w.error;
    WEEKS = w.data.map((r) => ({ ...r.data, questions: {} }));
    if (!WEEKS.length) throw new Error('题库是空的（可能是登录还没生效），请刷新页面');
    for (let from = 0; ; from += 1000) {
      const { data, error } = await SB.from('questions').select('id,data').range(from, from + 999);
      if (error) throw error;
      for (const q of data) QB[q.id] = q.data;
      if (data.length < 1000) break;
    }
    TYPES = (WEEKS[0] && WEEKS[0].types) || {};
  } else {
    const idx = await fetch('data/weeks.json').then((r) => r.json());
    TYPES = idx.types || {};
    WEEKS = await Promise.all(idx.weeks.map((w) => fetch('data/' + w.file).then((r) => r.json())));
    for (const w of WEEKS) Object.assign(QB, w.questions);
  }
  PLAN = WEEKS.flatMap((w) => w.days.map((d) => ({ ...d, week: w.week })));
  PLAN.sort((a, b) => (a.dates[0] < b.dates[0] ? -1 : 1));
}

/* ============ 判分 ============ */
function parseNum(s) {
  s = String(s).trim().replace(/\s/g, '');
  if (!s) return NaN;
  if (s.includes('/')) {
    const [a, b] = s.split('/');
    if (!b) return NaN;
    const x = Number(a), y = Number(b);
    return y === 0 ? NaN : x / y;
  }
  return Number(s);
}
function sprCorrect(input, answers) {
  const norm = (x) => String(x).trim().replace(/\s/g, '').replace(/^\+/, '');
  const u = norm(input);
  if (!u) return false;
  if (answers.some((a) => norm(a) === u)) return true;
  const uv = parseNum(u);
  if (isNaN(uv)) return false;
  for (const a of answers) { const av = parseNum(a); if (!isNaN(av) && Math.abs(av - uv) < 1e-9) return true; }
  const decs = (u.split('.')[1] || '').length;
  if (!u.includes('/') && decs >= 3) {
    for (const a of answers) if (String(a).includes('/') && Math.abs(parseNum(a) - uv) <= 0.0006) return true;
  }
  return false;
}
function isCorrect(q, a) {
  if (!q || !a || a.c == null || a.c === '') return false;
  return q.kind === 'mcq' ? a.c === q.ans : sprCorrect(a.c, q.ans);
}
function answerText(q) { return q.kind === 'mcq' ? q.ans : q.ans.join(' 或 '); }
function gradeList(qids, ans) { return qids.reduce((c, id) => c + (isCorrect(QB[id], ans[id]) ? 1 : 0), 0); }

/* ============ 计时（时间只在答题时走；关闭页面后照常倒计时） ============ */
function timerUsed(t) { return Math.min(t.limitMs, t.usedMs + (t.runningSince ? Date.now() - t.runningSince : 0)); }
function timerLeft(t) { return t.limitMs - timerUsed(t); }
function timerStart(t) { if (!t.runningSince) t.runningSince = Date.now(); }
function timerPause(t) { if (t.runningSince) { t.usedMs = timerUsed(t); t.runningSince = null; } }

/* ============ 设置、账本、萌宠 ============ */
function settings() { return Store.get('meta', 'settings') || { name: '', reviewCap: 0, unlocks: {} }; }
function saveSettings(s) { Store.put('meta', 'settings', s); }
function ledger() { return Store.get('meta', 'ledger') || { items: [] }; }
function petState() { return Store.get('meta', 'pet') || { cat: 'orange', wear: null, hideDeco: [] }; }

const LEVELS = [0, 20, 50, 90, 140, 200, 270, 350, 450, 600, 800, 1000];

function unlockAt(u) { const o = settings().unlocks || {}; return o[u.id] != null ? o[u.id] : u.at; }
function allUnlocks() {
  return [
    ...PETS.map((x) => ({ ...x, kind: 'pet' })),
    ...WEARS.map((x) => ({ ...x, kind: 'wear' })),
    ...DECOS.map((x) => ({ ...x, kind: 'deco' })),
  ].map((u) => ({ ...u, at: unlockAt(u) })).sort((a, b) => a.at - b.at);
}
const KIND_CN = { pet: '萌宠', wear: '配饰', deco: '小窝装饰' };
function isUnlocked(id, coins = coinsEarned()) { const u = allUnlocks().find((x) => x.id === id); return !!u && coins >= u.at; }
function nextUnlock(c) { return allUnlocks().find((u) => u.at > c) || null; }
function levelOf(c) { let l = 1; LEVELS.forEach((t, i) => { if (c >= t) l = i + 1; }); return l; }
function levelRange(c) { const l = levelOf(c); return { l, from: LEVELS[l - 1], to: LEVELS[l] ?? null }; }

/* ============ 每日计划 ============ */
const runOf = (id) => Store.get('runs', id);
function todayPlan(T) {
  // 今天排定的关卡，或今天提前开始的关卡（补做的不算）
  return PLAN.find((p) => { const r = runOf(p.id); return r ? r.startedOn === T && !r.makeup : p.dates.includes(T); }) || null;
}
function makeups(T) {
  return PLAN.filter((p) => {
    const r = runOf(p.id);
    if (r && (r.doneAt || (!r.makeup && r.startedOn === T))) return false;
    return p.dates[p.dates.length - 1] < T;
  });
}
function nextUpcoming(T) { return PLAN.find((p) => !runOf(p.id) && p.dates[0] > T) || null; }
function planOfDate(d) { return PLAN.find((p) => { const r = runOf(p.id); return r ? r.startedOn === d : p.dates.includes(d); }) || null; }

function newRun(p, T) {
  const mk = (sec, list) => ({
    limitMs: SEC_LIMIT[sec], usedMs: 0, runningSince: null, doneAt: null,
    stages: list.map((st) => ({ type: st.type, qids: st.qids.slice(), status: 'todo', cur: 0, ans: {}, startUsed: null, timeMs: null, correct: null, total: st.qids.length, doneAt: null, hist: null })),
  });
  return { dayId: p.id, startedOn: T, createdAt: Date.now(), sections: { rw: mk('rw', p.reading), math: mk('math', p.math) }, doneAt: null, coins: {}, notes: {} };
}
function saveRun(run) { Store.put('runs', run.dayId, run); }

// 该题型此前的平均正确率与平均每题用时（只统计每日新题）
function histSnapshot(type, excludeDayId) {
  let q = 0, c = 0, ms = 0;
  for (const r of Store.all('runs')) {
    if (r.dayId === excludeDayId) continue;
    for (const sec of ['rw', 'math']) for (const st of r.sections[sec].stages) {
      if (st.status !== 'done' || st.type !== type) continue;
      q += st.total; c += st.correct; ms += st.timeMs || 0;
    }
  }
  return q ? { q, acc: c / q, msPerQ: ms / q } : null;
}

function startRunStage(run, sec, idx) {
  const S = run.sections[sec], st = S.stages[idx];
  if (st.status === 'todo') { st.status = 'active'; st.startUsed = S.usedMs; st.hist = histSnapshot(st.type, run.dayId); }
  timerStart(S);
  saveRun(run);
}

function submitRunStage(run, sec, idx, timedOut) {
  const S = run.sections[sec];
  timerPause(S);
  const finish = (st) => {
    if (st.startUsed == null) { st.startUsed = S.usedMs; st.hist = histSnapshot(st.type, run.dayId); }
    st.timeMs = Math.max(0, S.usedMs - st.startUsed);
    st.status = 'done'; st.doneAt = Date.now();
    st.correct = gradeList(st.qids, st.ans); st.total = st.qids.length;
    collectWrong(st.qids, st.ans, 'day:' + run.dayId);
  };
  if (idx >= 0 && S.stages[idx].status !== 'done') finish(S.stages[idx]);
  if (timedOut) { S.usedMs = S.limitMs; S.stages.forEach((st) => { if (st.status !== 'done') finish(st); }); }
  if (S.stages.every((st) => st.status === 'done') && !S.doneAt) { S.doneAt = Date.now(); sectionReward(run, sec); }
  if (run.sections.rw.doneAt && run.sections.math.doneAt && !run.doneAt) {
    run.doneAt = Date.now();
    run.coins.done = REWARD.done;
    run.notes.done = '新题全部完成';
  }
  saveRun(run);
}

function sectionReward(run, sec) {
  const S = run.sections[sec];
  let n = 0, c = 0, ms = 0, expC = 0, expMs = 0;
  for (const st of S.stages) {
    if (!st.hist) continue;
    n += st.total; c += st.correct; ms += st.timeMs || 0;
    expC += st.hist.acc * st.total; expMs += st.hist.msPerQ * st.total;
  }
  const k = sec === 'rw' ? 'rw' : 'math';
  if (!n) {
    run.coins[k + 'Acc'] = 0; run.coins[k + 'Speed'] = 0;
    run.notes[k + 'Acc'] = run.notes[k + 'Speed'] = '第一次练这些题型，先建立基线';
    return;
  }
  const accT = c / n, accH = expC / n, msT = ms / n, msH = expMs / n;
  const accWin = accT > accH + 1e-9 || accT === 1;
  const speedWin = msT < msH && accT >= accH - 1e-9;
  run.coins[k + 'Acc'] = accWin ? REWARD.acc : 0;
  run.coins[k + 'Speed'] = speedWin ? REWARD.speed : 0;
  run.notes[k + 'Acc'] = `正确率 ${Math.round(accT * 100)}%，往期 ${Math.round(accH * 100)}%`;
  run.notes[k + 'Speed'] = `每题 ${fmtSec(msT)}，往期 ${fmtSec(msH)}` + (msT < msH && !speedWin ? '（正确率下降，不计速度奖）' : '');
}
const runCoins = (r) => sum(Object.values(r.coins || {}));

/* ============ 错题本与艾宾浩斯复习 ============ */
function collectWrong(qids, ans, from) {
  const T = todayStr();
  for (const id of qids) {
    const q = QB[id];
    if (!q || isCorrect(q, ans[id])) continue;
    const last = ans[id] && ans[id].c != null ? ans[id].c : null;
    const w = Store.get('wrong', id);
    if (w) {
      Object.assign(w, { stage: 0, due: addDays(T, 1), mastered: false, times: (w.times || 1) + 1, lastAns: last, lastFrom: from });
      Store.put('wrong', id, w);
    } else {
      Store.put('wrong', id, { qid: id, sec: q.sec, type: q.type, addedOn: T, source: 'auto', from, stage: 0, due: addDays(T, 1), mastered: false, hist: [], times: 1, lastAns: last });
    }
  }
}
function addWrongManual(id, lastAns) {
  const q = QB[id], T = todayStr();
  if (!q || Store.get('wrong', id)) return;
  Store.put('wrong', id, { qid: id, sec: q.sec, type: q.type, addedOn: T, source: 'manual', from: 'manual', stage: 0, due: addDays(T, 1), mastered: false, hist: [], times: 0, lastAns: lastAns ?? null });
}
function dueWrong(T) {
  return Store.all('wrong')
    .filter((w) => !w.mastered && w.due <= T && w.addedOn < T && QB[w.qid])
    .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : a.stage - b.stage));
}
function getOrCreateReview(T) {
  let r = Store.get('reviews', T);
  if (r) return r;
  const due = dueWrong(T), cap = +settings().reviewCap || 0;
  const mk = (sec) => {
    let qids = due.filter((w) => w.sec === sec).map((w) => w.qid);
    if (cap > 0) qids = qids.slice(0, cap);
    return { qids, limitMs: qids.length * REVIEW_PER_Q[sec], usedMs: 0, runningSince: null, status: qids.length ? 'todo' : 'done', cur: 0, ans: {}, result: {}, correct: null, total: qids.length, doneAt: qids.length ? null : Date.now() };
  };
  r = { date: T, createdAt: Date.now(), sections: { rw: mk('rw'), math: mk('math') }, doneAt: null, coin: 0, empty: false };
  if (!r.sections.rw.qids.length && !r.sections.math.qids.length) { r.empty = true; r.doneAt = Date.now(); }
  Store.put('reviews', T, r);
  return r;
}
function submitReviewSection(r, sec) {
  const S = r.sections[sec];
  timerPause(S);
  S.status = 'done'; S.doneAt = Date.now();
  let c = 0;
  for (const id of S.qids) {
    const ok = isCorrect(QB[id], S.ans[id]);
    S.result[id] = ok;
    if (ok) c++;
    srsUpdate(id, ok, r.date, S.ans[id]);
  }
  S.correct = c; S.total = S.qids.length;
  if (r.sections.rw.status === 'done' && r.sections.math.status === 'done' && !r.doneAt) {
    r.doneAt = Date.now();
    r.coin = r.date === todayStr() ? REWARD.review : 0;
  }
  Store.put('reviews', r.date, r);
}
function srsUpdate(id, ok, date, a) {
  const w = Store.get('wrong', id);
  if (!w) return;
  w.hist = (w.hist || []).concat({ d: date, ok, a: a && a.c != null ? a.c : null });
  if (ok) {
    w.stage = (w.stage || 0) + 1;
    if (w.stage >= SRS.length) { w.mastered = true; w.masteredOn = date; }
    else w.due = addDays(date, SRS[w.stage]);
  } else {
    w.stage = 0; w.due = addDays(date, 1); w.times = (w.times || 1) + 1; w.lastAns = a && a.c != null ? a.c : null;
  }
  Store.put('wrong', id, w);
}

/* ============ 额外练习 ============ */
function extraTypes() { const s = []; WEEKS.forEach((w) => Object.keys(w.extra || {}).forEach((t) => { if (!s.includes(t)) s.push(t); })); return s; }
function extraPool(type) {
  const used = new Set(Store.all('extras').flatMap((e) => e.qids));
  return WEEKS.flatMap((w) => (w.extra || {})[type] || []).filter((id) => QB[id] && !used.has(id));
}
function newExtra(type, n) {
  const qids = extraPool(type).slice(0, n);
  const id = 'x' + uid();
  const e = { id, type, sec: typeSec(type), date: todayStr(), qids, limitMs: qids.length * (EXTRA_PER_Q[type] || 90000), usedMs: 0, runningSince: null, status: 'todo', cur: 0, ans: {}, correct: null, total: qids.length, createdAt: Date.now() };
  Store.put('extras', id, e);
  return e;
}
function submitExtra(e) {
  timerPause(e);
  e.status = 'done'; e.doneAt = Date.now();
  e.correct = gradeList(e.qids, e.ans); e.total = e.qids.length;
  collectWrong(e.qids, e.ans, 'extra:' + e.id);
  Store.put('extras', e.id, e);
}

/* ============ 今日状态、金币 ============ */
function todayStatus(T = todayStr()) {
  const p = todayPlan(T);
  const run = p ? runOf(p.id) : null;
  const rev = Store.get('reviews', T);
  const dueN = rev ? rev.sections.rw.qids.length + rev.sections.math.qids.length : dueWrong(T).length;
  const planDone = !p || !!(run && run.doneAt);
  const revDone = rev ? !!rev.doneAt : dueN === 0;
  return { T, p, run, rev, dueN, planDone, revDone, allDone: planDone && revDone, hasTasks: !!p || dueN > 0 };
}
function coinsEarned(before) {
  const runs = Store.all('runs').filter((r) => !before || r.startedOn < before);
  const revs = Store.all('reviews').filter((r) => !before || r.date < before);
  return sum(runs, runCoins) + sum(revs, (r) => r.coin || 0);
}
function coinsOnDate(d) {
  return sum(Store.all('runs').filter((r) => r.startedOn === d), runCoins) + ((Store.get('reviews', d) || {}).coin || 0);
}
function coinsRedeemed() { return sum(ledger().items.filter((i) => i.status === 'done'), (i) => i.coins); }
function coinsPending() { return sum(ledger().items.filter((i) => i.status === 'pending'), (i) => i.coins); }
function coinBalance() { return coinsEarned() - coinsRedeemed(); }

/* ============ 周报 ============ */
function weekReport(ws) {
  const we = addDays(ws, 6);
  const runs = Store.all('runs').filter((r) => r.startedOn >= ws && r.startedOn <= we);
  const revs = Store.all('reviews').filter((r) => r.date >= ws && r.date <= we);
  const acc = { rw: [0, 0], math: [0, 0] }, times = { rw: [], math: [] };
  for (const r of runs) for (const sec of ['rw', 'math']) {
    const S = r.sections[sec];
    for (const st of S.stages) if (st.status === 'done') { acc[sec][0] += st.correct; acc[sec][1] += st.total; }
    if (S.doneAt) times[sec].push(S.usedMs);
  }
  const revQ = sum(revs, (r) => (r.sections.rw.status === 'done' ? r.sections.rw.total : 0) + (r.sections.math.status === 'done' ? r.sections.math.total : 0));
  const revC = sum(revs, (r) => (r.sections.rw.correct || 0) + (r.sections.math.correct || 0));
  const coins = sum(runs, runCoins) + sum(revs, (r) => r.coin || 0);
  const before = coinsEarned(ws), after = before + coins;
  const avg = (a) => (a.length ? sum(a) / a.length : null);
  return {
    ws, we, runs, revs, coins, before, after,
    rwAcc: acc.rw, mathAcc: acc.math, rwAvg: avg(times.rw), mathAvg: avg(times.math),
    daysDone: runs.filter((r) => r.doneAt).length, reviewsDone: revs.filter((r) => r.doneAt && !r.empty).length,
    revQ, revC, levelStart: levelOf(before), levelEnd: levelOf(after),
    unlocked: allUnlocks().filter((u) => u.at > before && u.at <= after),
  };
}

/* ============ 按题型统计（老师视图） ============ */
function typeStats() {
  const s = {};
  const get = (t) => (s[t] ||= { type: t, q: 0, c: 0, ms: 0, sessions: [], xq: 0, xc: 0, rq: 0, rc: 0 });
  for (const r of Store.all('runs')) for (const sec of ['rw', 'math']) for (const st of r.sections[sec].stages) {
    if (st.status !== 'done') continue;
    const x = get(st.type);
    x.q += st.total; x.c += st.correct; x.ms += st.timeMs || 0;
    x.sessions.push({ d: r.startedOn, acc: st.total ? st.correct / st.total : 0, n: st.total, at: st.doneAt });
  }
  for (const e of Store.all('extras')) if (e.status === 'done') { const x = get(e.type); x.xq += e.total; x.xc += e.correct; }
  for (const rv of Store.all('reviews')) for (const sec of ['rw', 'math']) {
    const S = rv.sections[sec];
    if (S.status !== 'done') continue;
    for (const id of S.qids) { const q = QB[id]; if (!q) continue; const x = get(q.type); x.rq++; if (S.result[id]) x.rc++; }
  }
  for (const w of Store.all('wrong')) { const x = get(w.type); x.wOpen = (x.wOpen || 0) + (w.mastered ? 0 : 1); x.wDone = (x.wDone || 0) + (w.mastered ? 1 : 0); }
  Object.values(s).forEach((x) => x.sessions.sort((a, b) => a.at - b.at));
  return s;
}

/* ============ 超时自动交卷 ============ */
function checkTimers() {
  if (!Store.canWrite) return false;
  let changed = false;
  for (const r of Store.all('runs')) for (const sec of ['rw', 'math']) {
    const S = r.sections[sec];
    if (S.runningSince && timerLeft(S) <= 0) { submitRunStage(r, sec, S.stages.findIndex((s) => s.status === 'active'), true); changed = true; }
  }
  for (const rv of Store.all('reviews')) for (const sec of ['rw', 'math']) {
    const S = rv.sections[sec];
    if (S.runningSince && timerLeft(S) <= 0) { submitReviewSection(rv, sec); changed = true; }
  }
  for (const e of Store.all('extras')) if (e.runningSince && timerLeft(e) <= 0) { submitExtra(e); changed = true; }
  return changed;
}

/* ============ 题目 HTML 渲染 ============ */
const MML = 'http://www.w3.org/1998/Math/MathML';
// Chrome 的 MathML Core 不支持 <mfenced>，换成带括号的 <mrow>
function fixMath(root) {
  const list = [...root.getElementsByTagName('mfenced')].reverse();
  for (const f of list) {
    const open = f.hasAttribute('open') ? f.getAttribute('open') : '(';
    const close = f.hasAttribute('close') ? f.getAttribute('close') : ')';
    const seps = (f.hasAttribute('separators') ? f.getAttribute('separators') : ',').replace(/\s/g, '');
    const row = document.createElementNS(MML, 'mrow');
    const mo = (t) => { const o = document.createElementNS(MML, 'mo'); o.textContent = t; return o; };
    if (open) row.appendChild(mo(open));
    const kids = [...f.children];
    kids.forEach((k, i) => {
      row.appendChild(k);
      if (i < kids.length - 1 && seps) row.appendChild(mo(seps[Math.min(i, seps.length - 1)]));
    });
    if (close) row.appendChild(mo(close));
    f.replaceWith(row);
  }
}

/* ============ 高亮与批注 ============ */
function hlTextNodes(root) {
  const out = [];
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => (n.parentElement && n.parentElement.closest('svg,math') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
  });
  let n;
  while ((n = w.nextNode())) out.push(n);
  return out;
}
function hlOffset(root, container, offset) {
  const r = document.createRange();
  r.setStart(root, 0);
  r.setEnd(container, offset);
  const frag = r.cloneContents();
  frag.querySelectorAll('svg,math').forEach((x) => x.remove());
  return frag.textContent.length;
}
function applyHL(root, list) {
  list.forEach((h, idx) => {
    let pos = 0;
    for (const t of hlTextNodes(root)) {
      const len = t.length, a = pos, b = pos + len;
      pos = b;
      if (b <= h.s || a >= h.e) continue;
      let node = t;
      const s = Math.max(h.s - a, 0), e = Math.min(h.e - a, len);
      if (e < len) node.splitText(e);
      if (s > 0) node = node.splitText(s);
      const mark = document.createElement('mark');
      mark.className = 'hl hl-' + (h.c || 'y') + (h.n ? ' has-note' : '');
      mark.dataset.h = h.i ?? idx;
      node.parentNode.insertBefore(mark, node);
      mark.appendChild(node);
    }
  });
}

/* ============ 作答会话 ============ */
let PR = null;
function makeSession(ctx) {
  if (ctx.kind === 'run') {
    const run = runOf(ctx.id), S = run.sections[ctx.sec], st = S.stages[ctx.idx];
    return {
      ctx, qids: st.qids, ans: st.ans, timer: S, holder: st, sec: ctx.sec,
      title: `Section ${ctx.sec === 'rw' ? 1 : 2}: ${SEC_FULL[ctx.sec]}`,
      chip: `关卡 ${ctx.idx + 1}/${S.stages.length} · ${typeName(st.type)}`,
      save: (now) => (now ? saveRun(run) : Store.putSoon('runs', run.dayId, run)),
      submit: (timedOut) => { submitRunStage(run, ctx.sec, ctx.idx, timedOut); },
      after: () => go('stage', { id: ctx.id, sec: ctx.sec, idx: ctx.idx, fresh: true }),
    };
  }
  if (ctx.kind === 'review') {
    const r = Store.get('reviews', ctx.id), S = r.sections[ctx.sec];
    return {
      ctx, qids: S.qids, ans: S.ans, timer: S, holder: S, sec: ctx.sec,
      title: `错题巩固: ${SEC_FULL[ctx.sec]}`,
      chip: `${SEC_NAME[ctx.sec]}错题 · ${S.qids.length} 题`,
      save: (now) => (now ? Store.put('reviews', r.date, r) : Store.putSoon('reviews', r.date, r)),
      submit: () => submitReviewSection(r, ctx.sec),
      after: () => go('reviewDone', { id: ctx.id, sec: ctx.sec, fresh: true }),
    };
  }
  const e = Store.get('extras', ctx.id);
  return {
    ctx, qids: e.qids, ans: e.ans, timer: e, holder: e, sec: e.sec,
    title: `额外练习: ${SEC_FULL[e.sec]}`,
    chip: `${typeName(e.type)} · ${e.qids.length} 题 · 不计金币`,
    save: (now) => (now ? Store.put('extras', e.id, e) : Store.putSoon('extras', e.id, e)),
    submit: () => submitExtra(e),
    after: () => go('extraDone', { id: e.id, fresh: true }),
  };
}

function startSession(ctx) {
  if (ctx.kind === 'run') startRunStage(runOf(ctx.id), ctx.sec, ctx.idx);
  else {
    const obj = ctx.kind === 'review' ? Store.get('reviews', ctx.id).sections[ctx.sec] : Store.get('extras', ctx.id);
    if (obj.status === 'todo') obj.status = 'active';
    timerStart(obj);
    if (ctx.kind === 'review') Store.put('reviews', ctx.id, Store.get('reviews', ctx.id)); else Store.put('extras', ctx.id, obj);
  }
  const sess = makeSession(ctx);
  PR = { sess, elim: false, nav: false, hideTimer: false, check: false, qStart: Date.now(), warned: timerLeft(sess.timer) <= 300000 };
  if (sess.holder.cur == null || sess.holder.cur >= sess.qids.length) sess.holder.cur = 0;
  renderPractice();
  clearInterval(window._tick);
  window._tick = setInterval(tickPractice, 500);
}

function curQid() { return PR.sess.qids[PR.sess.holder.cur]; }
function ansOf(qid) { const s = PR.sess; return (s.ans[qid] ||= {}); }
function trackTime() {
  if (!PR || PR.check) { if (PR) PR.qStart = Date.now(); return; }
  const now = Date.now(), a = ansOf(curQid());
  a.t = (a.t || 0) + (now - PR.qStart);
  PR.qStart = now;
}

function tickPractice() {
  if (!PR || VIEW.name !== 'practice') { clearInterval(window._tick); return; }
  const left = timerLeft(PR.sess.timer);
  const el = $('#bbClock');
  if (el) { el.textContent = fmtClock(left); el.parentElement.classList.toggle('low', left <= 300000); }
  if (!PR.warned && left <= 300000 && left > 0) { PR.warned = true; toast('还剩 5 分钟', 'warn'); }
  if (left <= 0) finishSession(true);
}

function finishSession(timedOut) {
  if (!PR) return;
  trackTime();
  clearInterval(window._tick);
  const sess = PR.sess;
  PR = null;
  sess.submit(timedOut);
  Store.flush();
  if (timedOut) toast('时间到，已自动交卷', 'warn');
  sess.after();
}

function leavePractice() {
  trackTime();
  PR.sess.save(true);
  clearInterval(window._tick);
  PR = null;
  go('home');
}

function sprInput(a) {

function navGrid(fromCheck) {

function gotoQ(k) {
  trackTime();
  PR.check = false;
  PR.nav = false;
  PR.sess.holder.cur = Math.max(0, Math.min(PR.sess.qids.length - 1, k));

}

function postRenderPractice() {
  const root = $('.bb');
  fixMath(root);
  const s = PR.sess;
  $('#bbHide').onclick = () => { PR.hideTimer = !PR.hideTimer; $('.bb-timer').classList.toggle('hidden', PR.hideTimer); $('#bbHide').textContent = PR.hideTimer ? 'Show' : 'Hide'; };
  $('#bbExit').onclick = () => confirmBox('保存并退出？', '作答已保存。按规定倒计时不会暂停，回来时会接着剩余时间作答，时间到会自动交卷。', '保存退出', leavePractice);

  $('#bbPopX').onclick = () => { PR.nav = false; $('#bbPop').classList.remove('open'); };
  $('#bbGoCheck').onclick = () => { trackTime(); PR.check = true; PR.nav = false; renderPractice(); };
  $$('#bbPop .g, .bb-check .g').forEach((b) => (b.onclick = () => gotoQ(+b.dataset.k)));
  const back = $('#bbBack');

  const next = $('#bbNext');
  if (next) next.onclick = () => {
    if (s.holder.cur < s.qids.length - 1) gotoQ(s.holder.cur + 1);

  };
  const sub = $('#bbSubmit');
  if (sub) sub.onclick = () => {
    const un = s.qids.filter((id) => !(s.ans[id] && s.ans[id].c != null && s.ans[id].c !== '')).length;
    confirmBox('提交本关？', un ? `还有 ${un} 题没作答，提交后按错题计算。` : '全部作答完毕，提交后可以查看答案和解析。', '提交', () => finishSession(false));
  };
  const ref = $('#bbRef');
  if (ref) ref.onclick = showReference;
  $('#bbNotes').onclick = toggleNotesDrawer;
  if (PR.check) return;

  const qid = curQid(), q = QB[qid];
  const mark = $('#bbMark');
  mark.onclick = () => { const a = ansOf(qid); a.m = !a.m; s.save(); mark.classList.toggle('on', a.m); mark.innerHTML = (a.m ? ICON.bookmark : ICON.bookmarkO) + '<span>Mark for Review</span>'; };
  const el = $('#bbElim');
  if (el) el.onclick = () => { PR.elim = !PR.elim; el.classList.toggle('on', PR.elim); root.classList.toggle('elim', PR.elim); };
  $$('.opt').forEach((b) => (b.onclick = () => {
    const a = ansOf(qid), L = b.dataset.l;
    a.c = L;
    a.x = (a.x || []).filter((x) => x !== L);
    s.save();
    $$('.opt-row').forEach((r) => {
      r.classList.toggle('sel', r.dataset.l === L);
      if (r.dataset.l === L) { r.classList.remove('crossed'); r.querySelector('.opt-x').innerHTML = `<span class="xl">${L}</span>`; }
    });
  }));
  $$('.opt-x').forEach((b) => (b.onclick = () => {
    const a = ansOf(qid), L = b.dataset.l;

    else {

function bindHighlighting(qid) {
  const tools = $('#hlTools'), card = $('#hlCard');
  const bb = $('.bb');
  let pending = null;
  const hide = () => { tools.hidden = true; pending = null; };
  bb.addEventListener('mouseup', (ev) => {
    if (ev.target.closest('#hlTools,#hlCard')) return;
    setTimeout(() => {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.rangeCount) { hide(); return; }
      const r = sel.getRangeAt(0);
      const zone = (r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement).closest('.hl-zone');
      if (!zone) { hide(); return; }
      const s0 = hlOffset(zone, r.startContainer, r.startOffset), e0 = hlOffset(zone, r.endContainer, r.endOffset);
      if (e0 - s0 < 1) { hide(); return; }
      pending = { k: zone.dataset.k, s: s0, e: e0 };
      const rect = r.getBoundingClientRect();
      tools.hidden = false;
      tools.style.left = Math.max(8, Math.min(window.innerWidth - 220, rect.left + rect.width / 2 - 100)) + 'px';
      tools.style.top = Math.max(8, rect.top - 46) + 'px';
    }, 0);
  });
  tools.onmousedown = (e) => e.preventDefault();
  tools.onclick = (e) => {
    const b = e.target.closest('button');
    if (!b || !pending) return;
    const a = ansOf(qid);
    a.hl = a.hl || [];
    const h = { ...pending, c: b.dataset.c === 'note' ? 'y' : b.dataset.c, n: '' };
    a.hl.push(h);
    PR.sess.save();
    window.getSelection().removeAllRanges();
    hide();
    rerenderHL(qid);
    if (b.dataset.c === 'note') openHLCard(qid, a.hl.length - 1);
  };
  bb.addEventListener('click', (e) => {
    const m = e.target.closest('mark.hl');
    if (m && !e.target.closest('.opt')) { openHLCard(qid, +m.dataset.h, m); return; }
    if (!e.target.closest('#hlCard,#hlTools,#notesDrawer')) card.hidden = true;
  });
}
function rerenderHL(qid) {
  const a = ansOf(qid);
  $$('.hl-zone').forEach((z) => {
    z.querySelectorAll('mark.hl').forEach((m) => { m.replaceWith(...m.childNodes); });
    z.normalize();
    applyHL(z, (a.hl || []).map((h, i) => ({ ...h, i })).filter((h) => h.k === z.dataset.k));
  });
  if (!$('#notesDrawer').hidden) fillNotesDrawer();
}
function openHLCard(qid, idx, markEl) {
  const a = ansOf(qid), h = a.hl[idx], card = $('#hlCard');
  if (!h) return;
  const m = markEl || $(`mark.hl[data-h="${idx}"]`);
  const rect = m ? m.getBoundingClientRect() : { left: 200, bottom: 200 };
  card.innerHTML = `<div class="hl-card-head"><span>批注</span>
      <span class="hl-colors">${['y', 'b', 'p'].map((c) => `<button class="sw sw-${c} ${h.c === c ? 'on' : ''}" data-c="${c}"></button>`).join('')}</span></div>
    <textarea id="hlNote" rows="3" placeholder="写下你的想法…">${esc(h.n || '')}</textarea>
    <div class="hl-card-btns"><button class="lnk danger" id="hlDel">删除高亮</button><button class="bb-btn small" id="hlSave">保存</button></div>`;
  card.hidden = false;
  card.style.left = Math.max(8, Math.min(window.innerWidth - 300, rect.left)) + 'px';

/* ============ 今日任务流程 ============ */
function dayStages(run) { return [...run.sections.rw.stages.map((s, i) => ({ sec: 'rw', idx: i, st: s })), ...run.sections.math.stages.map((s, i) => ({ sec: 'math', idx: i, st: s }))]; }
function nextTask(T = todayStr()) {
  const s = todayStatus(T);
  if (s.p) {
    if (!s.run) return { kind: 'start', p: s.p };
    for (const sec of ['rw', 'math']) {
      const idx = s.run.sections[sec].stages.findIndex((x) => x.status !== 'done');
      if (idx >= 0) return { kind: 'stage', id: s.run.dayId, sec, idx };
    }
  }
  if (!s.revDone) {
    if (!s.rev) { const due = dueWrong(T); return { kind: 'review', sec: due.some((w) => w.sec === 'rw') ? 'rw' : 'math', fresh: true }; }
    for (const sec of ['rw', 'math']) if (s.rev.sections[sec].status !== 'done') return { kind: 'review', sec };
  }
  return null;
}
function runTask(t) {
  const T = todayStr();
  if (!t) return;
  if (t.kind === 'start') {
    const run = newRun(t.p, T);
    if (t.p.dates[0] > T) run.early = true;
    saveRun(run);
    go('intro', { kind: 'run', id: run.dayId, sec: 'rw', idx: 0 });
  } else if (t.kind === 'stage') {
    const st = runOf(t.id).sections[t.sec].stages[t.idx];
    if (st.status === 'active') { VIEW = { name: 'practice', params: {} }; startSession({ kind: 'run', id: t.id, sec: t.sec, idx: t.idx }); }
    else go('intro', { kind: 'run', id: t.id, sec: t.sec, idx: t.idx });
  } else if (t.kind === 'review') {
    const r = getOrCreateReview(T);
    if (r.empty) { toast('今天没有到期的错题'); go('home'); return; }
    let sec = t.sec;
    if (r.sections[sec].status === 'done') sec = sec === 'rw' ? 'math' : 'rw';
    if (r.sections[sec].status === 'active') { VIEW = { name: 'practice', params: {} }; startSession({ kind: 'review', id: T, sec }); }
    else go('intro', { kind: 'review', id: T, sec });
  }
}
function startMakeup(p) {
  const T = todayStr();
  let run = runOf(p.id);
  if (!run) { run = newRun(p, T); run.makeup = true; saveRun(run); }
  for (const sec of ['rw', 'math']) {
    const idx = run.sections[sec].stages.findIndex((x) => x.status !== 'done');
    if (idx >= 0) {
      if (run.sections[sec].stages[idx].status === 'active') { VIEW = { name: 'practice', params: {} }; startSession({ kind: 'run', id: run.dayId, sec, idx }); }
      else go('intro', { kind: 'run', id: run.dayId, sec, idx });
      return;
    }
  }
}

function stageChip(st, sec, active) {

function questCard(s) {
  const T = s.T;
  const t = nextTask(T);
  let title, sub = '', chips = '', cta = '', extra = '';
  if (s.p) {
    const label = `${PLAN_LABEL(s.p)}`;
    const list = s.run ? dayStages(s.run) : [...s.p.reading.map((x) => ({ sec: 'rw', st: { type: x.type, qids: x.qids, total: x.qids.length, status: 'todo' } })), ...s.p.math.map((x) => ({ sec: 'math', st: { type: x.type, qids: x.qids, total: x.qids.length, status: 'todo' } }))];
    chips = `<ol class="stage-list">${list.map((x) => stageChip(x.st, x.sec, t && t.kind === 'stage' && t.sec === x.sec && t.idx === x.idx)).join('')}
      <li class="stage-chip review ${s.revDone ? 'done' : ''}"><span class="sc-sec rv">巩固</span><span class="sc-name">错题巩固</span><span class="sc-n">${s.dueN ? `${s.dueN} 题` : '无到期'}</span></li></ol>`;
    title = s.allDone ? '今日已通关！' : '今日关卡';
    sub = `${label} · 阅读 60 分钟 · 数学 45 分钟`;
  } else if (s.dueN > 0) {
    title = s.allDone ? '今日已通关！' : '今天是错题巩固日';
    sub = '把到期的错题再做一遍，按艾宾浩斯曲线安排';
    chips = `<ol class="stage-list"><li class="stage-chip review ${s.revDone ? 'done' : ''}"><span class="sc-sec rv">巩固</span><span class="sc-name">错题巩固</span><span class="sc-n">${s.dueN} 题</span></li></ol>`;
  } else {
    title = '今天没有关卡';
    const nu = nextUpcoming(T);
    sub = nu ? `下一关在 ${mdw(nu.dates[0])}。今天没有到期的错题，可以休息，也可以提前开始。` : '本周的关卡都排完了。周日把下周的题型告诉 Claude，就会更新题目。';
    if (nu) extra = '<button class="btn ghost" id="ctaEarly">提前开始下一关</button>';
  }
  if (t) {
    const label = t.kind === 'start' ? '开始今天练习'
      : t.kind === 'stage' ? (runOf(t.id).sections[t.sec].stages[t.idx].status === 'active' ? '继续答题' : (dayStages(runOf(t.id)).every((x) => x.st.status === 'todo') ? '开始今天练习' : '进入下一关'))
        : '开始错题巩固';
    cta = `<button class="btn primary big" id="ctaMain">${label}<span class="cta-arrow">▶</span></button>`;
  } else if (s.hasTasks && s.allDone) {
    cta = '<button class="btn primary big" id="ctaSettle">查看今日结算</button>';
    extra = '<button class="btn ghost" data-go="extra">去做额外练习</button>';
  }
  return `<div class="card quest ${s.allDone && s.hasTasks ? 'cleared' : ''}">
    <div class="quest-head"><div><h1>${title}</h1><p class="muted">${sub}</p></div>
      <div class="quest-date"><span>${md(T)}</span><b>${WD[dow(T)]}</b></div></div>
    ${chips}
    <div class="quest-cta">${cta}${extra}</div>
  </div>`;
}
function PLAN_LABEL(p) { const w = WEEKS.find((x) => x.week === p.week); return `${w ? w.label : ''} ${p.label || mdw(p.dates[0])}`; }

function makeupHTML(T) {
  const ms = makeups(T);

  </section>`;
}

function weekMapHTML(T) {
  const ws = weekStart(T);
  const nodes = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    const p = planOfDate(d);
    const r = p ? runOf(p.id) : null;
    const rev = Store.get('reviews', d);
    let state = 'rest', label = '休息';
    if (p) {
      label = '新题';
      state = r && r.doneAt ? 'clear' : d < T ? 'miss' : d === T ? 'today' : 'future';
    } else if (d < T) {
      if (rev && !rev.empty) { label = '巩固'; state = rev.doneAt ? 'clear' : 'miss'; }
    } else if (d === T) {
      state = 'today';
      label = (rev && !rev.empty) || dueWrong(d).length ? '巩固' : '休息';
      if (rev && rev.doneAt && !rev.empty) state = 'clear';
    } else { label = '巩固'; state = 'future'; }
    const c = coinsOnDate(d);
    nodes.push(`<li class="wm-node ${state}">
      <div class="wm-dot">${state === 'clear' ? '★' : state === 'miss' ? '!' : i + 1}</div>
      <div class="wm-day">${WD[dow(d)]}</div><div class="wm-date">${md(d)}</div>
      <div class="wm-tag">${label}</div>${c ? `<div class="wm-coin"><i class="coin sm"></i>${c}</div>` : ''}
    </li>`);
  }
  return `<ol class="weekmap">${nodes.join('')}</ol>`;
}

/* ============ 关卡总结 ============ */
function nextInRun(run) {
  for (const sec of ['rw', 'math']) {
    const idx = run.sections[sec].stages.findIndex((x) => x.status !== 'done');
    if (idx >= 0) return { kind: 'stage', id: run.dayId, sec, idx };
  }
  return null;
}
function nextButton(nx, fromSec) {
  const T = todayStr();
  if (!nx) {
    const s = todayStatus(T);
    if (s.hasTasks && s.allDone) return '<button class="btn primary big" id="nxBtn" data-act="settle">今日结算 ▶</button>';
    return '<button class="btn primary big" data-go="home">回首页</button>';
  }
  let label;
  if (nx.kind === 'stage') {
    const st = runOf(nx.id).sections[nx.sec].stages[nx.idx];
    label = nx.sec !== fromSec && fromSec === 'rw' ? `进入数学：${typeShort(st.type)}` : `下一关：${typeShort(st.type)}`;
  } else if (nx.kind === 'review') label = fromSec && nx.sec !== fromSec && !nx.fresh ? `下一部分：${SEC_NAME[nx.sec]}错题` : '开始错题巩固';
  else label = '继续';
  return `<button class="btn primary big" id="nxBtn">${label} ▶</button>`;
}
function bindNext(nx) {
  const b = $('#nxBtn');
  if (!b) return;
  b.onclick = () => {
    if (b.dataset.act === 'settle') { go('home'); if (!$('.settle-modal')) showSettlement(todayStr()); return; }
    if (nx.kind === 'stage') go('intro', { kind: 'run', id: nx.id, sec: nx.sec, idx: nx.idx });
    else runTask(nx);
  };
}
function qgridHTML(qids, ans, resultMap) {
  return `<div class="qgrid">${qids.map((id, i) => {
    const ok = resultMap ? resultMap[id] : isCorrect(QB[id], ans[id]);
    const blank = !(ans[id] && ans[id].c != null && ans[id].c !== '');
    return `<button class="qg ${ok ? 'ok' : 'bad'}" data-i="${i}" title="${ok ? '答对' : blank ? '未作答' : '答错'}"><span>${i + 1}</span><i>${ok ? '✓' : blank ? '–' : '✗'}</i></button>`;
  }).join('')}</div>`;
}
function bindQgrid(qids, ans, title, back) {
  $$('.qg').forEach((b) => (b.onclick = () => go('qview', { list: qids.map((id) => ({ qid: id, a: ans[id] })), idx: +b.dataset.i, title, back })));
}

VIEWS.stage = (p) => {

  const h = st.hist;

  const good = h ? accR >= h.acc : accR >= 0.7;
  const ap = activePet();
  const T = todayStr();
  const nx = nextInRun(run) || (run.startedOn === T && !run.makeup ? nextTask(T) : null);
  const diff = h ? Math.round(accR * 100) - Math.round(h.acc * 100) : null;
  const all = dayStages(run), pos = all.findIndex((x) => x.sec === p.sec && x.idx === p.idx);
  mount(`<section class="card result">
    <div class="result-top">
      <div class="result-pet">${petHTML({ cat: ap.cat, wear: ap.wear, h: 150, mode: p.fresh ? (good ? 'party' : 'hop') : 'idle', extraClass: 'pokeable' })}</div>
      <div class="result-main">
        <div class="kicker">第 ${pos + 1} / ${all.length} 关 · ${SEC_NAME[p.sec]} · ${esc(PLAN_LABEL(PLAN.find((x) => x.id === run.dayId)))}</div>
        <h1 class="result-title">${good ? '关卡完成！' : '关卡完成'}<span>${esc(typeName(st.type))}</span></h1>
        <div class="result-stats">
          <div class="rs"><span>正确率</span><b>${Math.round(accR * 100)}%</b><small>${st.correct} / ${st.total} 题</small></div>
          <div class="rs"><span>往期同题型平均</span><b>${h ? Math.round(h.acc * 100) + '%' : '—'}</b><small>${h ? (diff >= 0 ? `高出 ${diff} 个百分点` : `低了 ${-diff} 个百分点`) : '第一次练，记为基线'}</small></div>
          <div class="rs"><span>用时</span><b>${fmtClock(st.timeMs)}</b><small>每题 ${fmtSec(st.timeMs / st.total)}${h ? `，往期 ${fmtSec(h.msPerQ)}` : ''}</small></div>
        </div>
        ${S.doneAt ? `<p class="sec-done">${SEC_NAME[p.sec]}部分全部完成，共用 ${fmtDur(S.usedMs)}。${coinLine(run, p.sec)}</p>` : `<p class="muted">${SEC_NAME[p.sec]}倒计时已暂停，剩余 ${fmtClock(timerLeft(S))}。进入下一关后继续。</p>`}
      </div>
    </div>
    <div class="sec-head"><h2>逐题回顾</h2><span class="muted">点题号看正确答案与解析，可以写笔记；错题已自动收进错题本</span></div>
    ${qgridHTML(st.qids, st.ans)}
    <div class="result-btns">${nextButton(nx, p.sec)}<button class="btn ghost" data-go="home">回首页</button></div>
  </section>`, 'home');

  bindNext(nx);
};
function coinLine(run, sec) {

/* ============ 当天结算 ============ */
function maybeSettle() {
  if (ROLE !== 'student' || !Store.canWrite) return;
  const T = todayStr(), s = todayStatus(T);
  if (!s.hasTasks || !s.allDone) return;
  const d = Store.get('days', T);
  if (d && d.settledAt) return;
  showSettlement(T);
}
function showSettlement(T) {
  const runs = Store.all('runs').filter((r) => r.startedOn === T);
  const rev = Store.get('reviews', T);
  const before = coinsEarned(T);
  const today = coinsOnDate(T);
  const after = before + today;
  const ap = activePet(after);
  const rows = [];
  for (const r of runs) {
    const tag = runs.length > 1 ? `（${PLAN_LABEL(PLAN.find((x) => x.id === r.dayId))}）` : '';
    const c = r.coins || {}, n = r.notes || {};
    rows.push(['阅读速度奖' + tag, c.rwSpeed, n.rwSpeed, r.sections.rw.doneAt]);
    rows.push(['阅读正确率奖' + tag, c.rwAcc, n.rwAcc, r.sections.rw.doneAt]);
    rows.push(['数学速度奖' + tag, c.mathSpeed, n.mathSpeed, r.sections.math.doneAt]);
    rows.push(['数学正确率奖' + tag, c.mathAcc, n.mathAcc, r.sections.math.doneAt]);
    rows.push(['完成当天习题' + tag, c.done, r.doneAt ? '新题全部完成' : '还没做完', r.doneAt]);
  }
  rows.push(['完成错题巩固', rev ? rev.coin : 0, !rev || rev.empty ? '今天没有到期的错题' : rev.doneAt ? `答对 ${(rev.sections.rw.correct || 0) + (rev.sections.math.correct || 0)}/${rev.sections.rw.total + rev.sections.math.total}` : '还没做完', true]);
  const newly = allUnlocks().filter((u) => u.at > before && u.at <= after);
  const m = modal(`<div class="settle">
    <div class="settle-pet">${petHTML({ cat: ap.cat, wear: ap.wear, h: 130, mode: 'party' })}</div>
    <div class="kicker">${mdw(T)}</div>
    <h2 class="settle-title">今日结算</h2>
    <ul class="settle-rows">${rows.map(([k, v, note, ready]) => `<li class="${v ? 'got' : ''}"><span class="sr-k">${esc(k)}</span><span class="sr-note">${esc(ready ? note || '' : '还没完成')}</span><b>${v ? '+' + v : '0'}</b></li>`).join('')}</ul>
    <div class="settle-total"><span>今日获得</span><b><i class="coin"></i>+${today}</b></div>
    <div class="settle-sub">累计获得 ${after} 金币 · 可兑换 ${coinBalance()} 美元 · Lv ${levelOf(after)}</div>
    ${newly.length ? `<div class="settle-new"><b>解锁新内容！</b>${newly.map((u) => `<span class="unl">${KIND_CN[u.kind]}：${esc(u.name)}</span>`).join('')}</div>` : ''}
    <button class="btn primary big" id="settleOk">${dow(T) === 0 ? '查看本周周报' : '好耶'}</button>
  </div>`, { cls: 'settle-modal' });
  if (Store.canWrite && ROLE === 'student') Store.put('days', T, { date: T, settledAt: Date.now(), coins: today });
  m.el.querySelector('#settleOk').onclick = () => {
    m.close();
    if (dow(T) === 0) showWeekly(weekStart(T));
    else if (VIEW.name === 'home') go('home');
  };
}

function stageDots(w) {

function wrongList(readOnly) {

/* ============ 金币兑换 ============ */
function redeemHTML(student) {
  const L = ledger();
  const bal = coinBalance(), pend = coinsPending();
  const canConfirm = Store.canWrite;
  const items = L.items.slice().reverse().map((i) => `<li><span>${mdw(laDate(new Date(i.at)))}</span><b>${i.coins} 金币 = $${i.coins}</b>
    ${i.status === 'done' ? `<em class="ok-tag">已兑换 ${i.doneAt ? md(laDate(new Date(i.doneAt))) : ''}</em>` : canConfirm && !student ? `<button class="btn small rd-ok" data-id="${i.id}">确认已给</button>` : '<em class="muted">等爸爸确认</em>'}
    ${i.status === 'pending' && student && Store.canWrite ? `<button class="lnk danger rd-cancel" data-id="${i.id}">撤回</button>` : ''}</li>`).join('');
  return `<section class="card redeem">
    <div class="sec-head"><h2>金币兑换</h2><span class="muted">1 金币 = 1 美元</span></div>
    <div class="mini-stats"><div><b>${coinsEarned()}</b><span>累计获得</span></div><div><b>${coinsRedeemed()}</b><span>已兑换</span></div><div><b class="coin-txt">${bal}</b><span>可兑换</span></div></div>
    ${student && Store.canWrite ? `<form class="rd-form" id="rdForm"><label for="rdN">申请兑换</label><input id="rdN" type="number" min="1" max="${Math.max(0, bal - pend)}" placeholder="金币数"><button class="btn small" type="submit" ${bal - pend <= 0 ? 'disabled' : ''}>提交给爸爸</button></form>` : ''}
    <ul class="simple-list rd-list">${items || '<li class="empty">还没有兑换记录。</li>'}</ul>
  </section>`;
}
function bindRedeem(rerender) {
  const f = $('#rdForm');
  if (f) f.onsubmit = (e) => {
    e.preventDefault();
    const n = Math.floor(+$('#rdN').value);
    const max = coinBalance() - coinsPending();
    if (!n || n < 1 || n > max) { toast(`可以申请 1 到 ${max} 金币`, 'warn'); return; }
    const L = clone(ledger());
    L.items.push({ id: uid(), coins: n, at: Date.now(), status: 'pending' });
    Store.put('meta', 'ledger', L);
    toast('已提交，等爸爸确认');
    rerender();
  };
  $$('.rd-ok').forEach((b) => (b.onclick = () => {
    const L = clone(ledger());
    const it = L.items.find((x) => x.id === b.dataset.id);
    if (it) { it.status = 'done'; it.doneAt = Date.now(); }
    Store.put('meta', 'ledger', L);
    toast('已确认兑换');
    rerender();
  }));
  $$('.rd-cancel').forEach((b) => (b.onclick = () => {
    const L = clone(ledger());
    L.items = L.items.filter((x) => x.id !== b.dataset.id);
    Store.put('meta', 'ledger', L);
    rerender();
  }));
}
